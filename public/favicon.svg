<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Yadlapalli Lalith Nivas — Cybersecurity Engineer">
  <title>Lalith Nivas</title>
  <desc>Monogram LN with cyan accent dot for Yadlapalli Lalith Nivas</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#10b981"/>
      <stop offset="0.50" stop-color="#059669"/>
      <stop offset="1"   stop-color="#047857"/>
    </linearGradient>

    <radialGradient id="gloss" cx="0.25" cy="0.18" r="0.62">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dotHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#10b981" stop-opacity="0.72"/>
      <stop offset="1"   stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.78" cy="0.85" r="0.55">
      <stop offset="0"   stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#brand)"/>
  <rect width="100" height="100" rx="22" fill="url(#vignette)"/>
  <rect width="100" height="100" rx="22" fill="url(#gloss)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- The letter L -->
  <text x="44" y="74" text-anchor="middle"
        font-family="'Bricolage Grotesque', 'Inter', system-ui, sans-serif"
        font-weight="800" font-size="68" letter-spacing="-2"
        fill="#ffffff">L</text>

  <!-- Accent period -->
  <circle cx="78" cy="78" r="14" fill="url(#dotHalo)"/>
  <circle cx="78" cy="78" r="6"  fill="#10b981"/>
  <circle cx="76" cy="76" r="1.4" fill="#ffffff" fill-opacity="0.8"/>
</svg>
